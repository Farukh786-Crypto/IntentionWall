<main class="error-screen">
    <div class="error-screen__content">
        <div class="error-screen__hero">
            <img class="error-screen__image" src="/images/404-error.png" alt="" width="291" height="309">
            <p class="error-screen__code">404</p>
        </div>

        <div class="error-screen__text">
            <h1 class="error-screen__title">Page not found</h1>
            <p class="error-screen__message">The page you’re looking for couldn’t be found.</p>
        </div>

        <a class="error-screen__button" (click)="goToLogin()">
            <span class="material-symbols-outlined msi-md error-screen__button-icon" aria-hidden="true">
                arrow_back
            </span>
            Go To Login
        </a>
    </div>
</main>
